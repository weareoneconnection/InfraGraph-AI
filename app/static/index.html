<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InfraGraph AI</title>
<style>
:root{--bg:#081310;--panel:#0f1f19;--panel2:#132a21;--line:#24423a;--text:#ecf7f1;--muted:#93b3a6;--accent:#4fd69a;--gold:#e7c56a;--bad:#ff7d86;--blue:#7fb2ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1320px;margin:auto;padding:26px 20px 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.ey{color:var(--accent);font-size:12px;letter-spacing:.14em;font-weight:700}h1{font-size:34px;margin:6px 0 4px}.sub{color:var(--muted);max-width:820px;margin:0}
.kpis{display:flex;gap:8px;flex-wrap:wrap}.kpi{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;min-width:92px}.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:18px 0}.pipe div{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px;text-align:center;font-size:12px;color:var(--muted)}.pipe b{display:block;color:var(--text)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer}.tab.on{color:var(--text);border-color:var(--accent);background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:1fr 380px;gap:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.05em}
textarea,input,select{width:100%;background:#07110d;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px;font:inherit}textarea{min-height:110px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 14px;background:#1f9c66;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.bad{background:#62262e}
.item{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;margin-bottom:8px}.k{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;color:var(--muted)}.tag.ent{color:#bfe9d4;border-color:#2f6650;cursor:pointer}
.v{font-weight:800;border-radius:8px;padding:2px 10px}.SUPPORTED,.ok{background:#173d2d;color:var(--accent)}.CONTRADICTED,.bad{background:#41202a;color:var(--bad)}.INSUFFICIENT_EVIDENCE,.PENDING_REVIEW{background:#3a3218;color:var(--gold)}
svg{width:100%;height:560px;background:#07110d;border-radius:12px;border:1px solid var(--line)}svg text{fill:#d8efe4;font-size:11px;pointer-events:none}svg line{stroke:#3b6b5a;stroke-width:1.2}svg line.pending{stroke:var(--gold);stroke-dasharray:4 3}
.muted{color:var(--muted)}.small{font-size:12px}pre{white-space:pre-wrap;word-break:break-word;background:#07110d;border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
@media(max-width:960px){.grid{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main>
<header>
  <div><div class="ey">TRANSPORT KNOWLEDGE ASSET FACTORY</div><h1>InfraGraph AI</h1>
  <p class="sub">交通基础设施知识资产工厂：把分散、异构、中英文混杂的工程资料变成带出处、可版本化、可核验、可发布的知识图谱，为大模型和智能体提供可信的知识底座。</p></div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="pipe"><div><b>接入</b>文本/PDF/Word</div><div><b>分句</b>中英文</div><div><b>抽取</b>实体与编号</div><div><b>对齐</b>跨语言实体</div><div><b>关系</b>本体约束</div><div><b>复核</b>人工审定</div><div><b>核验</b>主张真伪</div><div><b>发布</b>哈希快照</div></div>
<div class="tabs" id="tabs"></div>
<section id="view"></section>
</main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o){const r=await fetch(p,o);const b=await r.json().catch(()=>({}));if(!r.ok){const d=b.detail;throw new Error(typeof d==='string'?d:(d?.message||r.status))}return b}
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});
const COLORS={Asset:'#7fb2ff',Defect:'#ff8f8f',Hazard:'#ffb36b',Measure:'#4fd69a',Activity:'#c7a6ff',Document:'#e7c56a',Standard:'#6fe1e0',Clause:'#f29ad8',Party:'#b9c8c2',Event:'#ffd56b'};
const TABS=[['ingest','知识生产'],['graph','图谱浏览'],['search','混合检索'],['ask','知识问答'],['claim','主张核验'],['release','复核与发布']];let tab='graph';
function tabs(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
async function kpis(){const m=await api('/metrics');$('kpis').innerHTML=[['资料',m.sources],['版本',m.versions],['实体',m.entities],['跨语言实体',m.cross_lingual_entities],['已确认关系',m.relations_by_status.ACCEPTED||0],['待复核',m.pending_review],['发布',m.releases]].map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}
function go(k){tab=k;tabs();({ingest,graph,search,ask,claim,release})[k]()}
async function ingest(){$('view').innerHTML=`<div class="grid"><div class="card"><h2>接入一份工程资料</h2>
<div class="row"><input id="ref" placeholder="来源编号，如 QA-NCR-0099" style="flex:1"><input id="ver" value="1.0" style="width:90px"></div>
<input id="title" placeholder="标题" style="margin-top:8px"><textarea id="content" placeholder="粘贴中文或英文工程资料，例如：P52墩柱拆模后发现裂缝，已开具NCR-0042。裂缝须采用环氧注浆修补，并按照GB 50204-2015进行复检。"></textarea>
<div class="row"><button class="btn" onclick="doIngest()">抽取并入库</button><input type="file" id="file" accept=".txt,.md,.pdf,.docx" style="flex:1"><button class="btn alt" onclick="doUpload()">上传文件</button></div><div id="ingestOut"></div></div>
<div class="card"><h2>演示语料</h2><p class="muted small">10 份合成的中英文工程资料：不符合项、检验记录、高处作业方案、分包来函、合同条款、吊装方案、支座检查、深基坑、强度不合格、事故报告。</p><button class="btn" onclick="loadDemo()">载入演示语料</button><h3>已入库资料</h3><div id="docs"></div></div></div>`;docs()}
async function docs(){const d=await api('/documents');$('docs').innerHTML=d.map(x=>`<div class="item"><b>${esc(x.ref)}</b> <span class="tag">v${esc(x.version)}</span>${x.version_count>1?`<span class="tag">${x.version_count} 个版本</span>`:''}<div class="small">${esc(x.title)}</div><div class="k">sha256 ${x.content_hash.slice(0,20)}…</div></div>`).join('')||'<p class="muted small">暂无</p>'}
async function loadDemo(){await post('/demo/load');await kpis();docs()}
function showSource(s){return `<div class="item"><b>${esc(s.ref)}</b> v${esc(s.current_version)} <span class="k">${(s.content_hash||'').slice(0,16)}…</span>${s.unchanged?'<span class="tag">内容未变，幂等跳过</span>':''}
<h3>实体 ${s.entities.length}</h3>${s.entities.map(e=>`<span class="tag ent" style="border-color:${COLORS[e.type]}" onclick="focusEntity('${esc(e.key)}')">${esc(e.key)}</span>`).join('')}
<h3>关系 ${s.relations.length}</h3>${s.relations.map(r=>`<div class="small">${esc(r.subject)} <b>${esc(r.predicate)}</b> ${esc(r.object)} <span class="tag ${r.status}">${r.status}</span><div class="k">“${esc(r.quote)}”</div></div>`).join('')}</div>`}
async function doIngest(){try{const s=await post('/documents',{ref:$('ref').value,title:$('title').value||$('ref').value,content:$('content').value,version:$('ver').value});$('ingestOut').innerHTML=showSource(s);kpis();docs()}catch(e){$('ingestOut').innerHTML=`<p class="v bad">${esc(e.message)}</p>`}}
async function doUpload(){const f=$('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);fd.append('ref',$('ref').value||f.name);fd.append('version',$('ver').value);try{const s=await api('/documents/upload',{method:'POST',body:fd});$('ingestOut').innerHTML=showSource(s);kpis();docs()}catch(e){$('ingestOut').innerHTML=`<p class="v bad">${esc(e.message)}</p>`}}
let focus=null;
async function graph(){$('view').innerHTML=`<div class="grid"><div class="card"><div class="row" style="margin:0 0 8px"><b>知识图谱</b><span class="muted small" id="gstat"></span><button class="btn alt" onclick="focus=null;graph()">全图</button></div><svg id="svg"></svg><div class="legend">${Object.entries(COLORS).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}<span>虚线 = 待人工复核</span></div></div><div class="card" id="side"><h2>实体详情</h2><p class="muted small">点击节点查看中英文别名、关系和每条关系的原文出处。</p></div></div>`;
 const g=await api('/graph'+(focus?`?focus=${encodeURIComponent(focus)}`:''));if(!g.nodes.length){$('gstat').textContent='暂无数据，请先在“知识生产”载入演示语料';return}draw(g);if(focus)focusEntity(focus)}
function draw(g){const svg=$('svg'),W=900,H=560;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 const N=g.nodes.map((n,i)=>({...n,x:W/2+230*Math.cos(2*Math.PI*i/g.nodes.length),y:H/2+210*Math.sin(2*Math.PI*i/g.nodes.length),fx:0,fy:0}));
 const idx=Object.fromEntries(N.map((n,i)=>[n.key,i]));const E=g.edges.filter(e=>e.subject in idx&&e.object in idx);
 for(let t=0;t<450;t++){const cool=1-t/450;for(const n of N){n.fx=(W/2-n.x)*0.005;n.fy=(H/2-n.y)*0.008}
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const a=N[i],b=N[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.1;const f=9000/(d*d);dx/=d;dy/=d;a.fx+=dx*f;a.fy+=dy*f;b.fx-=dx*f;b.fy-=dy*f}
  for(const e of E){const a=N[idx[e.subject]],b=N[idx[e.object]];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.1;const f=(d-105)*0.04;dx/=d;dy/=d;a.fx+=dx*f;a.fy+=dy*f;b.fx-=dx*f;b.fy-=dy*f}
  for(const n of N){const m=Math.hypot(n.fx,n.fy)||1,step=Math.min(m,12*cool+1);n.x=Math.min(W-60,Math.max(20,n.x+n.fx/m*step));n.y=Math.min(H-16,Math.max(16,n.y+n.fy/m*step))}}
 $('gstat').textContent=`${N.length} 个实体 · ${E.length} 条关系`;
 svg.innerHTML=E.map(e=>{const a=N[idx[e.subject]],b=N[idx[e.object]];return `<line class="${e.status==='PENDING_REVIEW'?'pending':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${esc(e.predicate)} ${esc(e.evidence[0].quote)}</title></line>`}).join('')
 +N.map(n=>`<g style="cursor:pointer" onclick="focusEntity('${esc(n.key)}')"><circle cx="${n.x}" cy="${n.y}" r="${n.key===focus?11:7}" fill="${COLORS[n.type]||'#aaa'}" stroke="#07110d" stroke-width="2"/><text x="${n.x+10}" y="${n.y+4}">${esc(n.canonical)}</text></g>`).join('')}
async function focusEntity(key){const e=await api('/entities/'+encodeURIComponent(key));if(tab!=='graph'){focus=key;go('graph');return}
 $('side').innerHTML=`<h2>${esc(e.canonical)} <span class="tag" style="border-color:${COLORS[e.type]}">${esc(e.type)}</span></h2><div class="k">${esc(e.key)}</div>
 <h3>别名（${e.cross_lingual?'中英文已对齐':'单语'}）</h3>${e.aliases.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}
 <h3>来源</h3>${e.sources.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}
 <h3>关系 ${e.relations.length}</h3>${e.relations.map(r=>`<div class="item small">${r.subject===e.key?'':`<span class="tag ent" onclick="focusEntity('${esc(r.subject)}')">${esc(r.subject)}</span>`} <b>${esc(r.predicate)}</b> ${r.object===e.key?'':`<span class="tag ent" onclick="focusEntity('${esc(r.object)}')">${esc(r.object)}</span>`} <span class="tag ${r.status}">${r.status}</span><div class="k">${esc(r.ref)} v${esc(r.version)} · “${esc(r.quote)}”</div></div>`).join('')}
 <div class="row"><button class="btn alt" onclick="focus='${esc(e.key)}';graph()">只看邻域</button></div>`}
function search(){$('view').innerHTML=`<div class="card"><h2>混合检索（BM25 + 实体链接，中英文互查）</h2><div class="row"><input id="q" value="P52 墩柱裂缝怎么处理" style="flex:1"><button class="btn" onclick="doSearch()">检索</button></div><div class="row small muted">试试：<span class="tag ent" onclick="$('q').value='crack on Pier P52 repair method';doSearch()">crack on Pier P52 repair method</span><span class="tag ent" onclick="$('q').value='S12 吊装方案谁批准';doSearch()">S12 吊装方案谁批准</span><span class="tag ent" onclick="$('q').value='工期延长多少天内通知';doSearch()">工期延长多少天内通知</span></div><div id="sr"></div></div>`}
async function doSearch(){const r=await api('/search?q='+encodeURIComponent($('q').value)+'&limit=6');$('sr').innerHTML=`<h3>查询中识别的实体</h3>${r.query_entities.map(k=>`<span class="tag ent">${esc(k)}</span>`).join('')||'<span class="muted small">无</span>'}<h3>结果</h3>`+r.results.map(p=>`<div class="item"><b>${esc(p.ref)}</b> v${esc(p.version)} · 第 ${p.sentence+1} 句 · 得分 ${p.score} ${p.linked_entities.map(k=>`<span class="tag ent">链接 ${esc(k)}</span>`).join('')}<p style="margin:6px 0">${esc(p.text)}</p><div class="k">sha256 ${p.content_hash.slice(0,20)}… · 字符 ${p.start}–${p.end}</div></div>`).join('')}
function ask(){$('view').innerHTML=`<div class="card"><h2>知识问答（检索增强，引用与数字逐一校验）</h2><p class="muted small">配置大模型时由模型依据检索到的原句作答，回答中的每个引用必须来自检索结果、每个数字必须出现在被引用的原句中，否则改为直接给出原句。未配置模型时给出原句摘录。</p><div class="row"><input id="qa" value="P52墩柱裂缝应该怎么处理，依据什么标准？" style="flex:1"><button class="btn" onclick="doAsk()">提问</button></div><div id="ar"></div></div>`}
async function doAsk(){$('ar').innerHTML='<p class="muted small">检索与生成中…</p>';const r=await post('/ask',{question:$('qa').value});const byId=Object.fromEntries(r.passages.map(p=>[p.id,p]));
 const ans=esc(r.answer||'知识库中没有相关内容。').replace(/\[(P\d+)\]/g,(m,id)=>byId[id]?`<span class="tag ent" title="${esc(byId[id].ref)}">${id}</span>`:m);
 $('ar').innerHTML=`<p style="margin:14px 0"><span class="v ${r.method==='model'?'SUPPORTED':'INSUFFICIENT_EVIDENCE'}">${r.method==='model'?'大模型回答 · 引用已校验':r.method==='extractive'?'原句摘录':'无结果'}</span>${r.model_rejected?' <span class="tag bad">模型回答未通过校验，已改为原句</span>':''}</p><div class="item">${ans}</div><h3>引用来源</h3>`+r.passages.filter(p=>r.citations.includes(p.id)).map(p=>`<div class="item small"><b>${p.id} · ${esc(p.ref)}</b> v${esc(p.version)} · 第 ${p.sentence+1} 句<div>${esc(p.text)}</div><div class="k">sha256 ${p.content_hash.slice(0,16)}…</div></div>`).join('')}
function claim(){$('view').innerHTML=`<div class="card"><h2>主张核验</h2><p class="muted small">输入一条工程主张，系统找出原文中的依据：一致为“有依据”，原文规定相反或数值不同为“相互矛盾”，找不到为“证据不足”。不构成工程或法律结论。</p><div class="row"><input id="c" value="P52裂缝无需修补，NCR-0042可直接关闭" style="flex:1"><button class="btn" onclick="doClaim()">核验</button></div>
<div class="row small">${['P52墩柱裂缝须采用环氧注浆修补','工期延长须在事件发生后7天内通知','The crack width at Pier P52 is 0.3 mm','TUN-01 tunnel ventilation fans require monthly maintenance'].map(x=>`<span class="tag ent" onclick="$('c').value='${x}';doClaim()">${x}</span>`).join('')}</div><div id="cr"></div></div>`}
const VZ={SUPPORTED:'有依据',CONTRADICTED:'相互矛盾',INSUFFICIENT_EVIDENCE:'证据不足'};
async function doClaim(){const r=await post('/claims/verify',{text:$('c').value});const MZ={rules:'规则判定',model:'大模型判定 · 引文已校验','rules+model':'规则与大模型一致'};$('cr').innerHTML=`<p style="margin:14px 0"><span class="v ${r.verdict}">${VZ[r.verdict]} · ${r.verdict}</span> <span class="tag">${MZ[r.method]||r.method}</span>${r.needs_review?' <span class="tag bad">大模型意见不同，建议人工复核</span>':''}</p>${r.model_opinion&&r.model_opinion.reason?`<p class="small muted">模型理由：${esc(r.model_opinion.reason)}${r.model_opinion.quote?' · 引文“'+esc(r.model_opinion.quote)+'”':''}</p>`:''}`+r.evidence.map(p=>`<div class="item"><b>${esc(p.ref)}</b> v${esc(p.version)} · 覆盖 ${p.coverage} · 实体重合 ${p.entity_overlap} ${p.polarity_conflict?'<span class="tag bad">义务相反</span>':''}${p.quantity_conflict?'<span class="tag bad">数值不同</span>':''}<p style="margin:6px 0">${esc(p.text)}</p></div>`).join('')}
async function release(){$('view').innerHTML=`<div class="grid"><div class="card"><h2>待复核关系</h2><p class="muted small">置信度低于 0.7 的关系（如同一句里多个构件、多个病害且无明确关联词）不会直接进图谱，必须由具名人员审定。</p><input id="actor" value="知识管理员 王工"><div id="rq"></div></div><div class="card"><h2>发布知识版本</h2><div id="gates"></div><div class="row"><input id="rv" placeholder="版本号，如 2026.10-r1"><button class="btn" onclick="doRelease()">发布</button></div><div id="rout"></div><h3>历史版本</h3><div id="rels"></div></div></div>`;await rq();await gatesView();rels()}
async function rq(){const q=await api('/review');$('rq').innerHTML=q.map(r=>`<div class="item small">${esc(r.subject)} <b>${esc(r.predicate)}</b> ${esc(r.object)} · 置信度 ${r.confidence}<div class="k">${esc(r.ref)} · “${esc(r.quote)}”</div><div class="row"><button class="btn" onclick="rv(${r.id},'accept')">确认</button><button class="btn bad" onclick="rv(${r.id},'reject')">驳回</button></div></div>`).join('')||'<p class="muted small">没有待复核的关系。</p>'}
async function rv(id,d){try{await post('/review/'+id,{decision:d,actor:$('actor').value})}catch(e){alert(e.message)}await rq();gatesView();kpis()}
const GL={provenance:'出处完整：每条关系的引文与原文逐字一致',ontology_conformance:'本体合规：主客体类型符合关系定义',review_queue_empty:'复核队列已清空',has_content:'有可发布内容'};
async function gatesView(){const g=await api('/releases/gates');$('gates').innerHTML=Object.entries(g).map(([k,v])=>`<div class="small"><span class="v ${v.passed?'ok':'bad'}" style="padding:0 6px">${v.passed?'✓':'✕'}</span> ${GL[k]}${v.pending?`（${v.pending} 条待复核）`:''}${v.checked!=null?`（检查 ${v.checked} 条）`:''}</div>`).join('')}
async function doRelease(){try{const r=await post('/releases',{version:$('rv').value,actor:$('actor').value});$('rout').innerHTML=`<div class="item"><b>${esc(r.version)}</b> 已发布 · ${r.counts.relations} 条关系<div class="k">manifest sha256 ${r.manifest_hash}</div><div class="small">新增 ${r.diff.added_relations.length} · 移除 ${r.diff.removed_relations.length} · 资料变化 ${r.diff.source_changes.length}</div></div>`;rels();kpis()}catch(e){$('rout').innerHTML=`<p class="v bad">${esc(e.message)}</p>`}}
async function rels(){const r=await api('/releases');$('rels').innerHTML=r.map(x=>`<div class="item small"><b>${esc(x.version)}</b> ${x.intact?'<span class="tag ok">哈希校验一致</span>':'<span class="tag bad">被改动</span>'} · ${esc(x.published_by)}<div class="k">${x.manifest_hash.slice(0,24)}… · ${x.counts.relations} 条关系 · ${x.counts.sources} 份资料</div>${x.diff.previous?`<div class="k">相对 ${esc(x.diff.previous)}：+${x.diff.added_relations.length} / -${x.diff.removed_relations.length}</div>`:''}</div>`).join('')||'<p class="muted small">尚未发布</p>'}
tabs();kpis();graph();
</script>
</body></html>
